name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Validate Scripts & QML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          for f in bin/*; do
            if [ -f "$f" ] && head -n1 "$f" | grep -qE '^#!.*(bash|sh)'; then
              bash -n "$f"
            elif [ -f "$f" ] && head -n1 "$f" | grep -qE '^#!.*python3'; then
              python3 -B -m py_compile "$f"
            fi
          done

      - name: Validate QML modules and qmldir registrations
        run: |
          python3 - <<'EOF'
          import os, sys

          def check_qmldir(directory, require_singleton=False):
              qmldir_path = os.path.join(directory, "qmldir")
              if not os.path.isfile(qmldir_path):
                  sys.exit(f"Missing {qmldir_path}")
              registered = set()
              with open(qmldir_path, "r", encoding="utf-8") as fh:
                  for line in fh:
                      parts = line.strip().split()
                      if not parts or parts[0] == "module" or parts[0].startswith("#"):
                          continue
                      if parts[0] == "singleton":
                          registered.add(parts[-1])
                      else:
                          registered.add(parts[-1])
              on_disk = {f for f in os.listdir(directory) if f.endswith(".qml")}
              missing = on_disk - registered
              extra = registered - on_disk
              if missing:
                  sys.exit(f"{qmldir_path}: unregistered QML files: {sorted(missing)}")
              if extra:
                  sys.exit(f"{qmldir_path}: missing QML files referenced: {sorted(extra)}")

          check_qmldir("components")
          check_qmldir("singletons", require_singleton=True)

          for root, _, files in os.walk("."):
              for f in files:
                  if f.endswith(".qml"):
                      p = os.path.join(root, f)
                      text = open(p, "r", encoding="utf-8").read()
                      if "import QtQuick" not in text:
                          sys.exit(f"{p}: missing 'import QtQuick'")
          print("All QML modules and scripts validated.")
          EOF

  package:
    name: Package Release Tarball
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Create tarball
        run: |
          mkdir -p dist
          tar -czvf dist/hacknet-shell.tar.gz \
            shell.qml singletons components greeter assets compositor bin LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: hacknet-shell-tarball
          path: dist/hacknet-shell.tar.gz

  release:
    name: Release
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hacknet-shell-tarball
      - uses: softprops/action-gh-release@v2
        with:
          files: hacknet-shell.tar.gz
          generate_release_notes: true

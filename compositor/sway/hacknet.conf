# HacknetOS fallback compositor config.
#
# hacknet-hyprland starts Hyprland first. On machines where Hyprland cannot get
# a usable EGL/DRM context (some VMs), it re-execs sway with this file. sway
# uses wlroots' pixman renderer, which is pure software and always works.
#
# The six fixed regions and every widget are drawn by quickshell, so the
# compositor only has to provide a black, borderless, gap-free output.

output * bg #000000 solid_color

default_border none
default_floating_border none
gaps inner 0
gaps outer 0
smart_gaps off
smart_borders off

# No titlebars, no tabbed/stacked decorations.
titlebar_border_thickness 0
titlebar_padding 0

# ---------------------------------------------------------------- input
input * {
    xkb_layout us
    repeat_rate 25
    repeat_delay 300
}

# ---------------------------------------------------------------- keybinds
set $mod Mod4

# App Opener / Search Bar: Super key alone (release) or Super+Space opens search bar
bindsym --release $mod exec hacknet-launcher
bindsym $mod+space exec hacknet-launcher

# Terminal: Super+Enter opens a new docked (left) terminal slot. Each terminal
# gets its own slot and its own NetMap node.
bindsym $mod+Return exec hacknet-dock-term

# Super+Shift+Enter opens a stage terminal (commands shown in DISPLAY).
bindsym $mod+Shift+Return exec hacknet-term --app-id hacknet-stage -e bash -lc 'fastfetch; exec bash'

# Window cycling: Super+Tab raises the next stage window, Super+Shift+Tab the
# previous one.
bindsym $mod+Tab exec hacknetctl cycle 1
bindsym $mod+Shift+Tab exec hacknetctl cycle -1

# Help.
bindsym $mod+F1 exec hacknetctl notify 'Help' 'Super+Enter: terminal | Super+Shift+Enter: stage | Super+Q: close | Super+Tab: cycle | Super+E: files | Print: screenshot'

# Window closing: Super+Q, Super+W, Alt+F4
bindsym $mod+q kill
bindsym $mod+w kill
bindsym Mod1+F4 kill

# NOTE: Super+Shift+Q logout binding intentionally removed.
# NOTE: Super+V (RAM gutter) and Super+Grave (theme) bindings removed — the
# gutter toggle lives in the Control Center; themes are switched there too.

# Desktops: Super+Shift+N adds one, Super+Left/Right cycles them, Super+1..5 switches.
bindsym $mod+Shift+n exec hacknetctl desktop-add
bindsym $mod+Right exec hacknetctl desktop-switch-next
bindsym $mod+Left exec hacknetctl desktop-switch-prev
bindsym $mod+1 exec hacknetctl desktop-switch 1
bindsym $mod+2 exec hacknetctl desktop-switch 2
bindsym $mod+3 exec hacknetctl desktop-switch 3
bindsym $mod+4 exec hacknetctl desktop-switch 4
bindsym $mod+5 exec hacknetctl desktop-switch 5

# Fullscreen the focused stage window (creates its own desktop-sized view).
bindsym $mod+f exec hacknetctl fullscreen-toggle

# Lock / file manager.
bindsym $mod+l exec sh -c 'mkdir -p ~/.local/state/hacknet && touch ~/.local/state/hacknet/locked'
bindsym $mod+e exec thunar

# Volume and media.
bindsym XF86AudioRaiseVolume exec hacknetctl volume up
bindsym XF86AudioLowerVolume exec hacknetctl volume down
bindsym XF86AudioMute exec hacknetctl volume mute
bindsym XF86AudioPlay exec hacknetctl media play_pause
bindsym XF86AudioNext exec hacknetctl media next
bindsym XF86AudioPrev exec hacknetctl media previous

# Screenshots (saves to Pictures, copies to clipboard, and notifies)
bindsym Print exec sh -c 'mkdir -p "$HOME/Pictures"; f="$HOME/Pictures/Screenshot_$(date +%Y%m%d_%H%M%S).png"; grim "$f" && (wl-copy < "$f" 2>/dev/null || true) && hacknetctl notify "Screenshot" "Saved to ~/Pictures"'
bindsym $mod+Shift+Print exec sh -c 'mkdir -p "$HOME/Pictures"; f="$HOME/Pictures/Screenshot_$(date +%Y%m%d_%H%M%S).png"; grim -g "$(slurp)" "$f" && (wl-copy < "$f" 2>/dev/null || true) && hacknetctl notify "Screenshot" "Region saved to ~/Pictures"'
bindsym $mod+Print exec sh -c 'mkdir -p "$HOME/Pictures"; f="$HOME/Pictures/Screenshot_$(date +%Y%m%d_%H%M%S).png"; grim "$f" && (wl-copy < "$f" 2>/dev/null || true) && hacknetctl notify "Screenshot" "Saved to ~/Pictures"'

# ---------------------------------------------------------------- window rules
for_window [app_id="foot"] border none
for_window [app_id="Alacritty"] border none
for_window [app_id="kitty"] border none
for_window [app_id="^hacknet-dock-"] border none
for_window [app_id="Thunar"] floating enable, border none
for_window [app_id="thunar"] floating enable, border none
for_window [class="Thunar"] floating enable, border none
for_window [app_id="pavucontrol"] floating enable, border none
for_window [app_id="nm-connection-editor"] floating enable, border none
for_window [app_id="blueman-manager"] floating enable, border none
# Portal file choosers (VSCode/Chromium open/save popups) must float inside DISPLAY.
for_window [app_id="xdg-desktop-portal-gtk"] floating enable, border none, resize set 606 594, move position 178 62
for_window [app_id="xdg-desktop-portal-gnome"] floating enable, border none, resize set 606 594, move position 178 62
for_window [app_id="code-oss" window_type="dialog"] floating enable, border none, resize set 606 594, move position 178 62
for_window [app_id="code" window_type="dialog"] floating enable, border none, resize set 606 594, move position 178 62
for_window [title="^Open File$"] floating enable, border none, resize set 606 594, move position 178 62
for_window [title="^Save File$"] floating enable, border none, resize set 606 594, move position 178 62
for_window [title="^Open Folder$"] floating enable, border none, resize set 606 594, move position 178 62
for_window [title="^Select a Folder$"] floating enable, border none, resize set 606 594, move position 178 62
for_window [app_id="gcr-prompter"] floating enable, border none, resize set 500 360, move position 231 179
for_window [window_type="dialog"] floating enable, border none, resize set 606 594, move position 178 62
for_window [window_type="menu"] floating enable, border none
for_window [window_type="tooltip"] floating enable, border none
for_window [window_type="notification"] floating enable, border none
for_window [class="polkit-gnome-authentication-agent-1"] floating enable, border none
for_window [class="nwg-look"] floating enable, border none

# ---------------------------------------------------------------- session
exec hash dbus-update-activation-environment 2>/dev/null && dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP=HacknetOS XDG_SESSION_DESKTOP=HacknetOS XDG_SESSION_TYPE=wayland
exec systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
exec sh -c 'systemctl --user reset-failed xdg-desktop-portal-gtk 2>/dev/null; systemctl --user restart xdg-desktop-portal-gtk xdg-desktop-portal 2>/dev/null'
exec hacknetd
exec sh -c 'sleep 1; exec quickshell -p /usr/share/quickshell/hacknet/shell.qml'
# The TERMINAL region is a real foot window placed by the daemon. Start it here
# and respawn it if no docked terminal is open, so the pane is never empty.
exec sh -c 'while :; do pgrep -f "[f]oot.*hacknet-term" >/dev/null 2>&1 || hacknet-term --app-id hacknet-term; sleep 2; done'

# Keep the pointer usable even with no window focused.
seat seat0 hide_cursor 0
